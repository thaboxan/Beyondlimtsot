# Netlify configuration for beyondlimitsot.co.za
[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/*"
  to = "/under_construction.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Netlify configuration for beyondlimitsot.co.za
[build]
  publish = "."
  command = ""

# Production branch (main)
[context.production]
  publish = "."

# Feature branch deploys (for testing)
[context.branch-deploy]
  publish = "."

# Deploy previews for all branches except main
[context.deploy-preview]
  publish = "."

[build.environment]
  NODE_VERSION = "18"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

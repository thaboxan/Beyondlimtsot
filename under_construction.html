<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Under Construction — By Ath'enkosi</title>
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0f172a;color:#e6edf3;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0}
    .card{max-width:820px;padding:2rem;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.02));box-shadow:0 10px 40px rgba(2,6,23,.6);text-align:center}
    .hat{font-size:6rem;display:block;transform-origin:center;animation:bounce 1.8s infinite}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    .primary{font-size:2rem;margin:0.5rem 0}
    .secondary{opacity:.85;margin-bottom:1rem}
    .cta{display:inline-block;margin-top:1rem;padding:.6rem 1rem;border-radius:999px;background:#ffb020;color:#071024;text-decoration:none;font-weight:700}
    .small{font-size:.85rem;color:rgba(230,237,243,.75);margin-top:.75rem}
  </style>
</head>
<body>
  <div class="card">
    <span class="hat">🚧👷</span>
    <h1 class="primary">www.beyondlimitsot.co.za</h1>
    <p style="font-size:1.2rem;margin:0.5rem 0 1rem;opacity:.9">Pardon our pixels — site under construction</p>
    <p class="secondary">We're busy teaching the servers to behave, bribing CSS with coffee, and convincing JavaScript to wear a helmet.</p>
    <a class="cta" href="mailto:info@beyondlimitsot.co.za">Send a carrier pigeon</a>
    <p class="small">Estimated completion: when the coffee kicks in. — By Ath'enkosi</p>
  </div>
</body>
</html>
